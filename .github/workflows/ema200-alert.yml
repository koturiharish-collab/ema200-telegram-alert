name: EMA200 Cross Alert

on:
  workflow_dispatch:

concurrency:
  group: ema200-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan 200 EMA crosses
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Auto-detect the script: the one that reads/writes ema200_state.json
          SCRIPT=$(grep -l "ema200_state" *.py | head -n 1)
          if [ -z "$SCRIPT" ]; then
            echo "No script referencing ema200_state found. Files here:"
            ls -la
            exit 1
          fi
          echo "Running $SCRIPT"
          python "$SCRIPT"

      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ema200_state.json
          git diff --cached --quiet && exit 0
          git commit -m "update ema200 state"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main

      - name: Telegram failure notice
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="EMA200 scan failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
