name: EMA200 Cross Alert

on:
  workflow_dispatch:

# Queue runs instead of letting them overlap (overlap caused the merge conflict)
concurrency:
  group: ema200-alert
  cancel-in-progress: false

permissions:
  contents: write   # needed so the job can push ema200_state.json

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan 200 EMA crosses
        # TODO: replace with YOUR existing command and env/secrets
        run: python ema200_scan.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ema200_state.json
          # Nothing changed -> nothing to save
          git diff --cached --quiet && exit 0
          git commit -m "update ema200 state"
          # State file is overwritten each run, so this run's version wins on conflict
          git pull --rebase -X theirs origin main
          git push origin HEAD:main

      - name: Telegram failure notice
        if: failure()
        # TODO: replace with YOUR existing failure-notice step if different
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="EMA200 scan failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
