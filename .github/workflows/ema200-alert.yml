name: EMA200 Cross Alert

on:
  schedule:
    # Every 15 min during NSE hours, Mon-Fri. Cron is UTC (IST = UTC+5:30).
    - cron: "45 3 * * 1-5"       # 09:15 IST
    - cron: "*/15 4-9 * * 1-5"   # 09:30 - 15:15 IST
    - cron: "0 10 * * 1-5"       # 15:30 IST
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a test message to Telegram"
        type: boolean
        default: false
      force:
        description: "Run even outside market hours (for testing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ema200-alert
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Telegram test message
        if: ${{ inputs.send_test }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="✅ 200 EMA bot: Telegram is connected"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan 200 EMA crosses
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_RUN: ${{ inputs.force }}
        run: python ema200_alert.py

      - name: Save state
        if: always()
        run: |
          git add ema200_state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "update ema200 state"
            git pull --rebase -q || true
            git push
          fi

      - name: Telegram failure notice
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="❌ 200 EMA scan FAILED - check GitHub Actions logs" > /dev/null
