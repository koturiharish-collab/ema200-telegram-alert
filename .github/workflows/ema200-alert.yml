name: EMA200 Cross Alert

on:
  schedule:
    # 16:15 IST (10:45 UTC), Mon-Fri, after the NSE close. Backup to the cron-job.org trigger.
    - cron: "45 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ema200-alert
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan 200 EMA crosses
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ema200_alert.py

      - name: Save state
        if: always()
        run: |
          git add ema200_state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "update ema200 state"
            git pull --rebase -q || true
            git push
          fi

      - name: Telegram failure notice
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="❌ 200 EMA scan FAILED - check GitHub Actions logs" > /dev/null
